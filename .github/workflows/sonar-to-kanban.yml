name: Sincronizar Issues do Sonar com Kanban

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  repository-projects: write

jobs:
  analisar-sonar-e-atualizar-kanban:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Executar testes e análise Sonar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn clean verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.token="$SONAR_TOKEN" \
            -Dsonar.projectKey="EricF3lix_ProjetoP3" \
            -Dsonar.organization="ericf3lix-1" \
            -Dsonar.host.url=https://sonarcloud.io

      - name: Aguardar indexação do SonarCloud
        run: |
          sleep 15

      - name: Buscar Issues do Sonar e Cadastrar no Kanban
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.KANBAN_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const projectKey = 'EricF3lix_ProjetoP3';
            const branch = context.ref ? context.ref.replace('refs/heads/', '') : 'develop';

            async function fetchAllSonarIssues(projectKey, branch) {
              let allIssues = [];
              let page = 1;
              const pageSize = 100;
              let total = 0;

              while (true) {
                const url = `https://sonarcloud.io/api/issues/search?componentKeys=${projectKey}&branch=${branch}&resolved=false&types=BUG,VULNERABILITY,CODE_SMELL&ps=${pageSize}&p=${page}`;
                const res = await fetch(url);
                if (!res.ok) break;

                const data = await res.json();
                allIssues = allIssues.concat(data.issues);
                total = data.paging.total;

                if (allIssues.length >= total || data.issues.length === 0) break;
                page++;
              }

              if (allIssues.length === 0) {
                page = 1;
                while (true) {
                  const fallbackUrl = `https://sonarcloud.io/api/issues/search?componentKeys=${projectKey}&resolved=false&types=BUG,VULNERABILITY,CODE_SMELL&ps=${pageSize}&p=${page}`;
                  const res = await fetch(fallbackUrl);
                  if (!res.ok) break;

                  const data = await res.json();
                  allIssues = allIssues.concat(data.issues);
                  total = data.paging.total;

                  if (allIssues.length >= total || data.issues.length === 0) break;
                  page++;
                }
              }

              return allIssues;
            }

            const sonarIssues = await fetchAllSonarIssues(projectKey, branch);

            if (sonarIssues.length === 0) {
              return;
            }

            let projects = [];
            try {
              const repoProjects = await github.graphql(`
                query($owner: String!, $repo: String!) {
                  repository(owner: $owner, name: $repo) {
                    projectsV2(first: 5) {
                      nodes { id title }
                    }
                  }
                }
              `, { owner: context.repo.owner, repo: context.repo.repo });
              projects = repoProjects.repository?.projectsV2?.nodes || [];
            } catch (e) {}

            if (projects.length === 0) {
              try {
                const userProjects = await github.graphql(`
                  query($owner: String!) {
                    user(login: $owner) {
                      projectsV2(first: 5) {
                        nodes { id title }
                      }
                    }
                  }
                `, { owner: context.repo.owner });
                projects = userProjects.user?.projectsV2?.nodes || [];
              } catch (e) {}
            }

            const kanban = projects.length > 0 ? projects[0] : null;

            const issuesExistentes = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              labels: 'sonar',
              per_page: 100
            });

            const chavesJaCriadas = new Set();
            for (const issueExistente of issuesExistentes) {
              const match = issueExistente.body && issueExistente.body.match(/Chave Sonar:\*\*\s*`([^`]+)`/);
              if (match) chavesJaCriadas.add(match[1]);
            }

            for (const issue of sonarIssues) {
              const sonarKey = issue.key;

              if (chavesJaCriadas.has(sonarKey)) {
                continue;
              }

              const title = `[Sonar] ${issue.message}`;
              const file = issue.component ? issue.component.split(':').pop() : 'N/A';
              const line = issue.line || 'N/A';

              const body = `### Detalhes da Issue (SonarCloud)\n\n` +
                           `- **Chave Sonar:** \`${sonarKey}\`\n` +
                           `- **Severidade:** ${issue.severity}\n` +
                           `- **Tipo:** ${issue.type}\n` +
                           `- **Arquivo:** \`${file}\`\n` +
                           `- **Linha:** ${line}\n\n` +
                           `*Issue gerada automaticamente pela integração Sonar-Kanban.*`;

              const novaIssue = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['sonar', issue.type.toLowerCase().replace('_', '-')]
              });

              if (kanban) {
                await github.graphql(`
                  mutation($projectId: ID!, $contentId: ID!) {
                    addProjectV2ItemById(input: { projectId: $projectId, contentId: $contentId }) {
                      item { id }
                    }
                  }
                `, {
                  projectId: kanban.id,
                  contentId: novaIssue.data.node_id
                });
              }

              await new Promise(r => setTimeout(r, 1500));
            }