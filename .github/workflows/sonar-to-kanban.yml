name: Sincronizar Issues do Sonar com Kanban

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  repository-projects: write

jobs:
  analisar-sonar-e-atualizar-kanban:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Executar testes e análise Sonar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn clean verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.token="$SONAR_TOKEN" \
            -Dsonar.projectKey="EricF3lix_ProjetoP3" \
            -Dsonar.organization="ericf3lix-1" \
            -Dsonar.host.url=https://sonarcloud.io

      - name: Aguardar indexação do SonarCloud
        run: |
          echo "Aguardando 15 segundos para o SonarCloud indexar as issues..."
          sleep 15

      - name: Buscar Issues do Sonar e Cadastrar no Kanban
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.KANBAN_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const projectKey = 'EricF3lix_ProjetoP3';
            const branch = context.ref ? context.ref.replace('refs/heads/', '') : 'develop';
            const LIMITE_POR_EXECUCAO = 50;

            // 1. Buscar TODAS as issues do SonarCloud com paginação
            async function fetchAllSonarIssues(projectKey, branch) {
              let allIssues = [];
              let page = 1;
              const pageSize = 100;

              while (true) {
                let url = `https://sonarcloud.io/api/issues/search?componentKeys=${projectKey}&branch=${branch}&resolved=false&types=BUG,VULNERABILITY,CODE_SMELL&ps=${pageSize}&p=${page}`;
                console.log(`Buscando página ${page} do SonarCloud...`);

                let res = await fetch(url);

                // Fallback sem branch se não encontrar nada
                if (res.ok) {
                  const data = await res.json();
                  if (page === 1 && data.issues.length === 0 && branch !== 'main') {
                    console.log('Nenhuma issue na branch, tentando sem filtro de branch...');
                    url = `https://sonarcloud.io/api/issues/search?componentKeys=${projectKey}&resolved=false&types=BUG,VULNERABILITY,CODE_SMELL&ps=${pageSize}&p=${page}`;
                    res = await fetch(url);
                    if (!res.ok) break;
                    const fallbackData = await res.json();
                    allIssues = allIssues.concat(fallbackData.issues);
                    if (allIssues.length >= fallbackData.paging.total) break;
                    page++;
                    continue;
                  }

            let apiUrl = `https://sonarcloud.io/api/issues/search?componentKeys=${projectKey}&branch=${branch}&resolved=false&types=BUG,VULNERABILITY,CODE_SMELL`;
            console.log(`Consultando SonarCloud: ${apiUrl}`);

            let res = await fetch(apiUrl);
            let sonarData = res.ok ? await res.json() : null;

            if (!sonarData || !sonarData.issues || sonarData.issues.length === 0) {
              const fallbackUrl = `https://sonarcloud.io/api/issues/search?componentKeys=${projectKey}&resolved=false&types=BUG,VULNERABILITY,CODE_SMELL`;
              console.log(`Tentando fallback geral: ${fallbackUrl}`);
              const fallbackRes = await fetch(fallbackUrl);
              if (fallbackRes.ok) {
                sonarData = await fallbackRes.json();
              }

              return allIssues;
            }

            const sonarIssues = await fetchAllSonarIssues(projectKey, branch);
            console.log(`Total de issues no Sonar: ${sonarIssues.length}`);

            if (sonarIssues.length === 0) {
              console.log('Nenhuma issue pendente no Sonar.');
              return;
            }

            let projects = [];
            try {
              const repoProjects = await github.graphql(`
                query($owner: String!, $repo: String!) {
                  repository(owner: $owner, name: $repo) {
                    projectsV2(first: 5) {
                      nodes { id title }
                    }
                  }
                }
              `, { owner: context.repo.owner, repo: context.repo.repo });
              projects = repoProjects.repository?.projectsV2?.nodes || [];
            } catch (e) {
              console.log('Erro ao buscar ProjectsV2 no repositório:', e.message);
            }

            if (projects.length === 0) {
              try {
                const userProjects = await github.graphql(`
                  query($owner: String!) {
                    user(login: $owner) {
                      projectsV2(first: 5) {
                        nodes { id title }
                      }
                    }
                  }
                `, { owner: context.repo.owner });
                projects = userProjects.user?.projectsV2?.nodes || [];
              } catch (e) {
                console.log('Erro ao buscar ProjectsV2 no perfil:', e.message);
              }
            }

            const kanban = projects.length > 0 ? projects[0] : null;

              const sonarKey = issue.key;

              const searchRes = await github.rest.search.issuesAndPullRequests({
                q: `repo:${context.repo.owner}/${context.repo.repo} is:issue in:body "${sonarKey}"`
              });

              if (searchRes.data.total_count > 0) {
                continue;
              }

              const title = `[Sonar] ${issue.message}`;
              const file = issue.component ? issue.component.split(':').pop() : 'N/A';
              const line = issue.line || 'N/A';

              const body = `### Detalhes da Issue (SonarCloud)\n\n` +
                           `- **Chave Sonar:** \`${sonarKey}\`\n` +
                           `- **Severidade:** ${issue.severity}\n` +
                           `- **Tipo:** ${issue.type}\n` +
                           `- **Arquivo:** \`${file}\`\n` +
                           `- **Linha:** ${line}\n\n` +
                           `*Issue gerada automaticamente pela integração Sonar-Kanban.*`;

              const novaIssue = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['sonar', issue.type.toLowerCase().replace('_', '-')]
              });

              if (kanban) {
                await github.graphql(`
                  mutation($projectId: ID!, $contentId: ID!) {
                    addProjectV2ItemById(input: { projectId: $projectId, contentId: $contentId }) {
                      item { id }
                    }
                  }
                `, {
                  projectId: kanban.id,
                  contentId: novaIssue.data.node_id
                });
              }

              // Pausa de 1 segundo entre cada criação para não estourar rate limit
              await new Promise(r => setTimeout(r, 1000));
