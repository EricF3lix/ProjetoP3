name: Integração contínua

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  rodar_testes:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Revisar codigo
        uses: actions/checkout@v4

      - name: Configurar o Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Rodar os testes do JUnit
        run: mvn test

  build-and-push:
    needs: rodar_testes
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            dockerfile: ./Dockerfile-linux
            tag_suffix: linux
          - os: windows-latest
            dockerfile: ./Dockerfile-windows
            tag_suffix: windows

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compilar projeto com Maven
        run: mvn clean package -DskipTests

      - name: Configurar Docker Buildx (somente Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0

      - name: Login no Docker Hub
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Construir e Enviar Imagem Docker (Linux, via Buildx)
        if: matrix.os == 'ubuntu-latest'
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/loja-aluga-de-um-tudo:${{ matrix.tag_suffix }}-latest
            ${{ secrets.DOCKER_USERNAME }}/loja-aluga-de-um-tudo:${{ matrix.tag_suffix }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Construir e Enviar Imagem Docker (Windows, docker build clássico)
        if: matrix.os == 'windows-latest'
        shell: bash
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          docker build -f ${{ matrix.dockerfile }} -t "$DOCKER_USERNAME/loja-aluga-de-um-tudo:${{ matrix.tag_suffix }}-latest" -t "$DOCKER_USERNAME/loja-aluga-de-um-tudo:${{ matrix.tag_suffix }}-${{ github.sha }}" .
          docker push "$DOCKER_USERNAME/loja-aluga-de-um-tudo:${{ matrix.tag_suffix }}-latest"
          docker push "$DOCKER_USERNAME/loja-aluga-de-um-tudo:${{ matrix.tag_suffix }}-${{ github.sha }}"

      - name: Publicar JAR como artefato
        uses: actions/upload-artifact@v4
        with:
          name: loja-aluga-de-um-tudo-${{ matrix.tag_suffix }}-${{ github.sha }}
          path: target/loja-aluga-de-um-tudo-1.0-SNAPSHOT.jar
          retention-days: 30
