name: Integração contínua

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  rodar_testes:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Revisar codigo
        uses: actions/checkout@v4

      - name: Configurar o Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Rodar os testes do JUnit
        run: mvn test

  build-and-push:
    needs: rodar_testes
    runs-on: ubuntu-latest

    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compilar projeto com Maven
        run: mvn clean package -DskipTests

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Construir e Enviar Imagem Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/loja-aluga-de-um-tudo:latest
            ${{ secrets.DOCKER_USERNAME }}/loja-aluga-de-um-tudo:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publicar JAR como artefato
        uses: actions/upload-artifact@v4
        with:
          name: loja-aluga-de-um-tudo-${{ github.sha }}
          path: target/loja-aluga-de-um-tudo-1.0-SNAPSHOT.jar
          retention-days: 30

  