name: Integração com Kanban

on:
  create:

jobs:
  mover-para-em-andamento:
      runs-on: ubuntu-latest
      if: github.event_name == 'create' && github.ref_type == 'branch'

      steps:
        - name: Mover issue para Em andamento
          uses: actions/github-script@v7
          with:
            github-token: ${{ secrets.KANBAN_TOKEN }}
            script: |
              const branchName = context.ref.replace('refs/heads/', '');
              console.log(`Branch criada: ${branchName}`);

              const match = branchName.match(/#?(\d+)/);
              if (!match) {
                console.log('Nenhum número de issue encontrado no nome da branch. Encerrando.');
                return;
              }

              const issueNumber = parseInt(match[1]);
              console.log(`Issue encontrada: #${issueNumber}`);

              const issue = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
              }).catch(() => null);

              if (!issue) {
                console.log(`Issue #${issueNumber} não encontrada.`);
                return;
              }

              const query = `
                query($owner: String!, $repo: String!) {
                  repository(owner: $owner, name: $repo) {
                    projectsV2(first: 10) {
                      nodes {
                        id
                        title
                        fields(first: 20) {
                          nodes {
                            ... on ProjectV2SingleSelectField {
                              id
                              name
                              options {
                                id
                                name
                              }
                            }
                          }
                        }
                        items(first: 50) {
                          nodes {
                            id
                            content {
                              ... on Issue {
                                number
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              `;

              const result = await github.graphql(query, {
                owner: context.repo.owner,
                repo: context.repo.repo,
              });

              const projects = result.repository.projectsV2.nodes;

              for (const project of projects) {
                const statusField = project.fields.nodes.find(f => f.name === 'Status');
                if (!statusField) continue;

                const emAndamento = statusField.options.find(o =>
                  o.name.toLowerCase().includes('andamento')
                );
                if (!emAndamento) continue;

                const item = project.items.nodes.find(i =>
                  i.content?.number === issueNumber
                );
                if (!item) {
                  console.log(`Issue #${issueNumber} não está no project "${project.title}".`);
                  continue;
                }

                await github.graphql(`
                  mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                    updateProjectV2ItemFieldValue(input: {
                      projectId: $projectId
                      itemId: $itemId
                      fieldId: $fieldId
                      value: { singleSelectOptionId: $optionId }
                    }) {
                      projectV2Item { id }
                    }
                  }
                `, {
                  projectId: project.id,
                  itemId: item.id,
                  fieldId: statusField.id,
                  optionId: emAndamento.id,
                });

                console.log(`A Issue #${issueNumber} foi movida para "Em andamento" no project "${project.title}".`);
              }