name: Integração com Kanban

on:
  create:
  pull_request:
    types: [opened, reopened]

jobs:
  mover-para-em-andamento:
    runs-on: ubuntu-latest
    if: (github.event_name == 'create' && github.ref_type == 'branch') || github.event_name == 'pull_request'

    steps:
      - name: Mover issues para Em andamento
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.KANBAN_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            let issueNumbers = [];

            if (context.eventName === 'pull_request') {
              const pr = context.payload.pull_request;
              const textToSearch = `${pr.title} ${pr.body || ''} ${pr.head.ref}`;
              console.log(`Analisando PR #${pr.number}: ${textToSearch}`);

              const matches = [...textToSearch.matchAll(/(?:fixes|closes|resolves)\s+#(\d+)|#(\d+)/gi)];
              issueNumbers = matches.map(m => parseInt(m[1] || m[2]));
            } else if (context.eventName === 'create' && context.payload.ref_type === 'branch') {
              const branchName = context.payload.ref;
              console.log(`Analisando branch criada: ${branchName}`);

              const matches = [...branchName.matchAll(/#(\d+)/g)];
              issueNumbers = matches.map(m => parseInt(m[1]));
            }

            issueNumbers = [...new Set(issueNumbers)];
            console.log(`Números de issue detectados: ${issueNumbers.join(', ') || 'nenhum'}`);

            if (issueNumbers.length === 0) {
              console.log('Nenhum número de issue detectado no evento. Encerrando.');
              return;
            }

            const query = `
              query($owner: String!, $repo: String!) {
                repository(owner: $owner, name: $repo) {
                  projectsV2(first: 5) {
                    nodes {
                      id title
                      fields(first: 20) {
                        nodes {
                          ... on ProjectV2SingleSelectField {
                            id name options { id name }
                          }
                        }
                      }
                      items(first: 100) {
                        nodes {
                          id
                          content { ... on Issue { number } }
                        }
                      }
                    }
                  }
                }
                user(login: $owner) {
                  projectsV2(first: 5) {
                    nodes {
                      id title
                      fields(first: 20) {
                        nodes {
                          ... on ProjectV2SingleSelectField {
                            id name options { id name }
                          }
                        }
                      }
                      items(first: 100) {
                        nodes {
                          id
                          content { ... on Issue { number } }
                        }
                      }
                    }
                  }
                }
              }
            `;

            let result;
            try {
              result = await github.graphql(query, {
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
            } catch (err) {
              console.log('Erro ao consultar GraphQL:', err.message);
              return;
            }

            const repoProjects = result.repository?.projectsV2?.nodes || [];
            const userProjects = result.user?.projectsV2?.nodes || [];
            const allProjects = [...repoProjects, ...userProjects];

            for (const project of allProjects) {
              const statusField = project.fields.nodes.find(f => f.name === 'Status');
              if (!statusField) continue;

              const emAndamento = statusField.options.find(o =>
                o.name.toLowerCase().includes('andamento')
              );
              if (!emAndamento) continue;

              for (const issueNumber of issueNumbers) {
                const item = project.items.nodes.find(i => i.content?.number === issueNumber);
                if (!item) {
                  console.log(`Issue #${issueNumber} não encontrada no projeto "${project.title}".`);
                  continue;
                }

                await github.graphql(`
                  mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                    updateProjectV2ItemFieldValue(input: {
                      projectId: $projectId
                      itemId: $itemId
                      fieldId: $fieldId
                      value: { singleSelectOptionId: $optionId }
                    }) {
                      projectV2Item { id }
                    }
                  }
                `, {
                  projectId: project.id,
                  itemId: item.id,
                  fieldId: statusField.id,
                  optionId: emAndamento.id,
                });

                console.log(`Sucesso: Issue #${issueNumber} movida para "Em andamento" no quadro "${project.title}".`);
              }
            }