name: Integração com Kanban

on:
  create:
  pull_request:
    types: [opened, reopened, ready_for_review, edited, closed]
    branches: [develop]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  atualizar-kanban:
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'create' && github.event.ref_type == 'branch') ||
      github.event_name == 'pull_request'

    steps:
      - name: Atualizar issues no Project
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.KANBAN_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const norm = s => (s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();

            const extrair = (texto, re) =>
              new Set([...(texto || '').matchAll(re)].map(m => parseInt(m[1])));

            const destinos = new Map();
            let fechar = false;

            if (context.eventName === 'create') {
              const branch = context.payload.ref;
              console.log(`Branch criada: ${branch}`);
              for (const n of extrair(branch, refRe)) destinos.set(n, 'andamento');
            } else {
              const pr = context.payload.pull_request;
              const acao = context.payload.action;
              console.log(`PR #${pr.number} (${acao}) ${pr.head.ref} -> ${pr.base.ref}`);

              const texto = `${pr.title}\n${pr.body || ''}`;

              if (acao === 'closed') {
                if (!pr.merged) {
                  console.log('PR fechado sem merge. Nada a fazer.');
                  return;
                }
                fechar = true;
                
                for (const n of extrair(texto, closingRe)) destinos.set(n, 'conclu');
              } else {
                if (pr.state !== 'open') {
                  console.log('PR não está aberto (edição em PR já encerrado). Nada a fazer.');
                  return;
                }
                if (pr.draft) {
                  console.log('PR em rascunho. Nada a fazer.');
                  return;
                }

                const atuais = extrair(texto, refRe);

                if (acao === 'edited') {
                  
                  const mudancas = context.payload.changes || {};
                  const tituloAntes = mudancas.title ? mudancas.title.from : pr.title;
                  const corpoAntes = mudancas.body ? (mudancas.body.from || '') : (pr.body || '');
                  const antes = extrair(`${tituloAntes}\n${corpoAntes}`, refRe);

                  for (const n of atuais) if (!antes.has(n)) destinos.set(n, 'revis');
                  for (const n of antes) if (!atuais.has(n)) destinos.set(n, 'andamento');
                } else {
                  
                  for (const n of atuais) destinos.set(n, 'revis');
                }
              }
            }

            console.log(
              'Issues e destinos: ' +
              ([...destinos].map(([n, a]) => `#${n}->${a}`).join(', ') || 'nenhuma')
            );
            if (destinos.size === 0) return;

            const consulta = `
              query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  issue(number: $number) {
                    state
                    projectItems(first: 20) {
                      nodes {
                        id
                        project {
                          id
                          title
                          field(name: "Status") {
                            ... on ProjectV2SingleSelectField {
                              id
                              options { id name }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;

            const mutacao = `
              mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $projectId
                  itemId: $itemId
                  fieldId: $fieldId
                  value: { singleSelectOptionId: $optionId }
                }) {
                  projectV2Item { id }
                }
              }
            `;

            for (const [numero, alvo] of destinos) {
              let issue;
              try {
                const r = await github.graphql(consulta, { owner, repo, number: numero });
                issue = r.repository.issue;
              } catch (err) {
                console.log(`Erro ao consultar #${numero}: ${err.message}`);
                continue;
              }

              if (!issue) {
                console.log(`#${numero} não é uma issue deste repositório (pode ser um PR). Ignorando.`);
                continue;
              }

              
              if (fechar && issue.state === 'OPEN') {
                try {
                  await github.rest.issues.update({
                    owner, repo,
                    issue_number: numero,
                    state: 'closed',
                    state_reason: 'completed',
                  });
                  console.log(`Issue #${numero} fechada.`);
                } catch (err) {
                  console.log(`Erro ao fechar #${numero}: ${err.message}`);
                  continue;
                }
              }

              if (!fechar && issue.state === 'CLOSED') {
                console.log(`Issue #${numero} já está fechada. Não vou movê-la.`);
                continue;
              }

              const itens = issue.projectItems.nodes;
              if (itens.length === 0) {
                console.log(`Issue #${numero} não está em nenhum Project.`);
                continue;
              }

              for (const item of itens) {
                const campo = item.project.field;
                const opcao = campo?.options?.find(o => norm(o.name).includes(alvo));
                if (!campo || !opcao) {
                  console.log(`Projeto "${item.project.title}": coluna "${alvo}" não encontrada.`);
                  continue;
                }

                try {
                  await github.graphql(mutacao, {
                    projectId: item.project.id,
                    itemId: item.id,
                    fieldId: campo.id,
                    optionId: opcao.id,
                  });
                  console.log(`Issue #${numero} -> "${opcao.name}" no projeto "${item.project.title}".`);
                } catch (err) {
                  console.log(`Erro ao mover #${numero}: ${err.message}`);
                }
              }
            }
