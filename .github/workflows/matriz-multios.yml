name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  create:
  workflow_dispatch:

jobs:
  # ================================
  # Job 1: Testes em múltiplos OS
  # ================================
  rodar_testes:
    if: github.event_name != 'create'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Revisar codigo
        uses: actions/checkout@v4

      - name: Configurar o Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Rodar os testes do JUnit
        run: mvn test

  # ================================
  # Job 2: Build Docker + JAR
  # ================================
  build-and-push:
    needs: rodar_testes
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && github.event_name != 'create'

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compilar projeto com Maven
        run: mvn clean package -DskipTests

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Construir e Enviar Imagem Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/loja-aluga-de-um-tudo:latest
            ${{ secrets.DOCKER_USERNAME }}/loja-aluga-de-um-tudo:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publicar JAR como artefato
        uses: actions/upload-artifact@v4
        with:
          name: loja-aluga-de-um-tudo-${{ github.sha }}
          path: target/loja-aluga-de-um-tudo-1.0-SNAPSHOT.jar
          retention-days: 30

  # ================================
  # Job 3: Kanban - mover para Em andamento ao criar branch
  # ================================
  mover-para-em-andamento:
    runs-on: ubuntu-latest
    if: github.event_name == 'create' && github.ref_type == 'branch'

    steps:
      - name: Mover issue para Em andamento
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.KANBAN_TOKEN }}
          script: |
            const branchName = context.ref.replace('refs/heads/', '');
            console.log(`Branch criada: ${branchName}`);

            const match = branchName.match(/#?(\d+)/);
            if (!match) {
              console.log('Nenhum número de issue encontrado no nome da branch. Encerrando.');
              return;
            }

            const issueNumber = parseInt(match[1]);
            console.log(`Issue encontrada: #${issueNumber}`);

            const issue = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            }).catch(() => null);

            if (!issue) {
              console.log(`Issue #${issueNumber} não encontrada.`);
              return;
            }

            const query = `
              query($owner: String!, $repo: String!) {
                repository(owner: $owner, name: $repo) {
                  projectsV2(first: 10) {
                    nodes {
                      id
                      title
                      fields(first: 20) {
                        nodes {
                          ... on ProjectV2SingleSelectField {
                            id
                            name
                            options {
                              id
                              name
                            }
                          }
                        }
                      }
                      items(first: 50) {
                        nodes {
                          id
                          content {
                            ... on Issue {
                              number
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;

            const result = await github.graphql(query, {
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            const projects = result.repository.projectsV2.nodes;

            for (const project of projects) {
              const statusField = project.fields.nodes.find(f => f.name === 'Status');
              if (!statusField) continue;

              const emAndamento = statusField.options.find(o =>
                o.name.toLowerCase().includes('andamento')
              );
              if (!emAndamento) continue;

              const item = project.items.nodes.find(i =>
                i.content?.number === issueNumber
              );
              if (!item) {
                console.log(`Issue #${issueNumber} não está no project "${project.title}".`);
                continue;
              }

              await github.graphql(`
                mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                  updateProjectV2ItemFieldValue(input: {
                    projectId: $projectId
                    itemId: $itemId
                    fieldId: $fieldId
                    value: { singleSelectOptionId: $optionId }
                  }) {
                    projectV2Item { id }
                  }
                }
              `, {
                projectId: project.id,
                itemId: item.id,
                fieldId: statusField.id,
                optionId: emAndamento.id,
              });

              console.log(`✅ Issue #${issueNumber} movida para "Em andamento" no project "${project.title}".`);
            }