name: Teste de integridade

on:
 push:
  branches: [main, develop]
 pull_request:
  branches: [main, develop]
 workflow_dispatch:

jobs:
 rodar_testes:
  runs-on: ${{ matrix.os }}
  strategy:
   fail-fast: false
   matrix:
    os: [ubuntu-latest, windows-latest, macos-latest]

  steps:
   - name: Revisar codigo
     uses: actions/checkout@v4

   - name: Configurar o Java
     uses: actions/setup-java@v4
     with:
      distribution: 'temurin'
      java-version: '21'

   - name: Rodar os testes do JUnit
     run: mvn test